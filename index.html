<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personalized SchemeGuider</title>
  <style>
    :root {
      --bg-cream: #f5f4eb;
      --card-cream: #fffdf5;
      --dark-green: #385e42;
      --accent-gold: #e2b155;
      --text-dark: #232b25;
      --input-bg: #faf7ee;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-cream);
      color: var(--text-dark);
    }

    /* Top Navigation Bar */
    header {
      background-color: var(--dark-green);
      color: white;
      padding: 15px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo-container {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-icon {
      background: var(--accent-gold);
      padding: 8px 12px;
      border-radius: 8px;
      font-weight: bold;
      color: #333;
    }

    .logo-text {
      font-size: 18px;
      font-weight: bold;
    }

    .logo-text span {
      color: var(--accent-gold);
    }

    nav a {
      color: #e0e6e1;
      text-decoration: none;
      margin-left: 20px;
      font-size: 14px;
    }

    nav a.active {
      font-weight: bold;
      color: white;
    }

    /* Form Container */
    .main-container {
      max-width: 650px;
      margin: 40px auto;
      padding: 0 20px;
    }

    .step-tag {
      text-align: center;
      color: #a37233;
      font-size: 12px;
      font-weight: bold;
      letter-spacing: 1px;
      margin-bottom: 5px;
    }

    .page-title {
      text-align: center;
      color: var(--dark-green);
      font-size: 28px;
      font-weight: 800;
      margin-bottom: 5px;
    }

    .page-subtitle {
      text-align: center;
      color: #666;
      font-size: 13px;
      margin-bottom: 25px;
    }

    .form-card {
      background: white;
      padding: 35px 30px;
      border-radius: 20px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.03);
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      color: #333;
      margin-bottom: 6px;
    }

    input, select {
      width: 100%;
      padding: 12px 15px;
      background-color: var(--input-bg);
      border: 1px solid #e2ded2;
      border-radius: 10px;
      font-size: 14px;
      color: #444;
      outline: none;
    }

    input:focus, select:focus {
      border-color: var(--dark-green);
    }

    .info-note {
      text-align: center;
      font-size: 11px;
      color: #777;
      margin: 20px 0 15px 0;
    }

    .submit-btn {
      width: 100%;
      padding: 14px;
      background-color: var(--dark-green);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }

    .submit-btn:hover {
      background-color: #2b4933;
    }

    /* Output Section */
    .results-container {
      margin-top: 40px;
    }

    .scheme-card {
      background-color: var(--card-cream);
      border: 1px solid #eee7d5;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 20px;
      position: relative;
    }

    .badge-tag {
      position: absolute;
      top: 18px;
      right: 20px;
      background-color: var(--accent-gold);
      color: #333;
      font-size: 10px;
      font-weight: bold;
      padding: 3px 8px;
      border-radius: 10px;
    }

    .scheme-category {
      font-size: 11px;
      font-weight: bold;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .scheme-title {
      font-size: 18px;
      color: var(--dark-green);
      margin: 4px 0 8px 0;
    }

    .scheme-benefit {
      font-size: 13px;
      color: #555;
      margin-bottom: 15px;
    }

    .why-box {
      background-color: #f3eedf;
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 12px;
      color: #554832;
      margin-bottom: 15px;
    }

    .card-buttons {
      display: flex;
      gap: 12px;
    }

    .btn-details, .btn-apply {
      flex: 1;
      text-align: center;
      padding: 10px;
      text-decoration: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: bold;
    }

    .btn-details {
      background-color: #eee9dc;
      color: #444;
    }

    .btn-apply {
      background-color: var(--dark-green);
      color: white;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo-container">
      <div class="logo-icon">🏛️</div>
      <div class="logo-text">Personalized <span>SchemeGuider</span></div>
    </div>
    <nav>
      <a href="#">Home</a>
      <a href="#" class="active">Profile</a>
      <a href="#">Results</a>
      <a href="#">Help</a>
      <a href="#">About</a>
    </nav>
  </header>

  <div class="main-container">
    <div class="step-tag">STEP 01 . PROFILE</div>
    <h1 class="page-title">Tell Us About You</h1>
    <p class="page-subtitle">We use your information to identify potentially relevant schemes.</p>

    <div class="form-card">
      <form id="schemeForm">
        <div class="form-group">
          <label>Age</label>
          <input type="number" id="age" required placeholder="Example: 20">
        </div>

        <div class="form-group">
          <label>Gender</label>
          <select id="gender" required>
            <option value="">Select Gender</option>
            <option value="Male">Male</option>
            <option value="Female">Female</option>
            <option value="Transgender">Transgender</option>
            <option value="All">Other / All</option>
          </select>
        </div>

        <div class="form-group">
          <label>Occupation / Category</label>
          <select id="occupation" required>
            <option value="">Select Occupation</option>
            <option value="Student">Student</option>
            <option value="Farmer">Farmer</option>
            <option value="Entrepreneur">Entrepreneur</option>
            <option value="Differently Abled">Differently Abled</option>
            <option value="All">All / Unemployed</option>
          </select>
        </div>

        <p class="info-note">Your information is used only to personalize scheme recommendations.</p>

        <button type="submit" class="submit-btn" id="submitBtn">Find My Schemes →</button>
      </form>
    </div>

    <div id="schemesList" class="results-container">
      <!-- Output Cards will appear here -->
    </div>
  </div>

  <script>
    document.getElementById('schemeForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const userProfile = {
        age: parseInt(document.getElementById('age').value),
        gender: document.getElementById('gender').value,
        occupation: document.getElementById('occupation').value
      };

      try {
        const response = await fetch('/api/match-schemes', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(userProfile)
        });

        const result = await response.json();
        const schemesList = document.getElementById('schemesList');
        schemesList.innerHTML = '';

        if (result.data && result.data.length > 0) {
          result.data.forEach(scheme => {
            let directUrl = scheme.url ? scheme.url.trim() : 'https://www.tn.gov.in';
            if (!directUrl.startsWith('http://') && !directUrl.startsWith('https://')) {
              directUrl = 'https://' + directUrl;
            }

            schemesList.innerHTML += `
              <div class="scheme-card">
                <span class="badge-tag">Eligibility Match</span>
                <div class="scheme-category">Welfare Scheme</div>
                <h3 class="scheme-title">${scheme.name}</h3>
                <p class="scheme-benefit">${scheme.benefit}</p>
                <div class="why-box">
                  🎯 <strong>Why this may suit you?</strong><br>
                  Matched based on your age, gender, and occupation profile.
                </div>
                <div class="card-buttons">
                  <a href="${directUrl}" target="_blank" rel="noopener noreferrer" class="btn-details">View Details</a>
                  <a href="${directUrl}" target="_blank" rel="noopener noreferrer" class="btn-apply">Apply</a>
                </div>
              </div>
            `;
          });
        } else {
          schemesList.innerHTML = '<p style="text-align:center; color:#777;">No matching schemes found for your profile.</p>';
        }
      } catch (error) {
        console.error('Error:', error);
        alert('Server Connection Error!');
      }
    });
  </script>

</body>
</html>
